[project]
name = "agentic-sdlc-mvp"
version = "0.1.0"
description = "SDLC agéntico seguro con orquestación de micro-agentes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "bandit>=1.7.8",
  "semgrep>=1.68.0",
  "trivy-python>=0.0.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/template-service"]
testpaths = ["apps", "orchestrator"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
